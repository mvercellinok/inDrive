<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="clase_dos">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>clase_dos</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBdJkysoQqjU0G9Zf9oTX8mZJJC_oOhDww&amp;language=es&amp;region=CL"></script>
  <script>
    (() => {
      const fields = ['displayName', 'formattedAddress', 'location'];
      const result = (place) => ({
        id: place.id,
        displayName: { text: place.displayName },
        formattedAddress: place.formattedAddress,
        location: {
          latitude: place.location.lat(),
          longitude: place.location.lng(),
        },
      });

      window.inDriveSearchPlaces = async (query) => {
        const { Place } = await google.maps.importLibrary('places');
        const { places } = await Place.searchByText({
          textQuery: query,
          fields: ['id', ...fields],
          language: 'es',
          region: 'cl',
          locationBias: {
            center: { lat: -33.4489, lng: -70.6693 },
            radius: 30000,
          },
          maxResultCount: 10,
        });
        return JSON.stringify(places.filter((place) => place.location).map(result));
      };

      window.inDriveGetPlace = async (id) => {
        const { Place } = await google.maps.importLibrary('places');
        const place = new Place({ id, requestedLanguage: 'es', requestedRegion: 'cl' });
        await place.fetchFields({ fields });
        if (!place.location) throw new Error('El destino no tiene coordenadas.');
        return JSON.stringify(result(place));
      };
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
