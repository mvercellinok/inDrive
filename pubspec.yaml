name: clase_dos
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  cloud_firestore: ^7.1.0
  file_picker: 10.3.10
  file_selector: ^1.1.0
  firebase_core: ^5.1.0
  firebase_storage: ^14.0.1
  flutter:
    sdk: flutter
  google_maps_flutter: ^2.19.0
  image_picker: ^1.2.4
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  record: ^7.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Barlow Condensed
      fonts:
        - asset: assets/fonts/Inter_18pt-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter_18pt-Bold.ttf
          weight: 400
        - asset: assets/fonts/Inter_18pt-Regular.ttf
          weight: 500